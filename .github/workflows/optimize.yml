name: Optimize images
on: workflow_dispatch
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg
      - name: Optimize
        working-directory: 21,22-November
        run: |
          shopt -s nullglob
          # your photos: max 800px, quality 70, and normalise extension to .jpg
          for f in assets/gallery/* assets/story/* assets/events/*; do
            case "${f,,}" in
              *.jpg|*.jpeg)
                mogrify -auto-orient -strip -resize '800x800>' -quality 70 "$f"
                n="${f%.*}.jpg"; [ "$f" != "$n" ] && mv "$f" "$n"
                ;;
            esac
          done
          # big frames / backgrounds (only ever shrinks, safe to re-run)
          for f in invite-frame story-frame; do mogrify -resize '1000x>' -quality 70 assets/$f.webp; done
          mogrify -resize '1400x>' -quality 70 assets/events-bg.webp
          mogrify -resize '1200x>' -quality 75 assets/hero-front.webp
          # music: only re-encode if still large
          m=assets/manamaganini-sathiyam.mp3
          if [ "$(stat -c%s "$m")" -gt 1500000 ]; then
            ffmpeg -y -i "$m" -b:a 96k -ac 1 /tmp/s.mp3 && mv /tmp/s.mp3 "$m"
          fi
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Optimize images"; git push; fi
